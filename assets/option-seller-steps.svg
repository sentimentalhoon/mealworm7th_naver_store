<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">스마트스토어 옵션 등록 흐름</title>
  <desc id="desc">상품 등록 화면에서 옵션을 조합형으로 설정하고 카테고리와 세부 선택을 입력하는 순서</desc>
  <rect width="1200" height="720" fill="#fffaf5"/>
  <rect x="40" y="40" width="1120" height="640" rx="34" fill="#fff" stroke="#ead8c5" stroke-width="3"/>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#4f2d16">판매자센터 설정 순서</text>
  <g font-family="Arial, sans-serif">
    <g>
      <circle cx="150" cy="230" r="42" fill="#4f2d16"/>
      <text x="150" y="243" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">1</text>
      <rect x="210" y="176" width="880" height="108" rx="22" fill="#fff7ef" stroke="#ead8c5" stroke-width="2"/>
      <text x="248" y="222" font-size="28" font-weight="800" fill="#4f2d16">상품 등록 또는 상품 수정</text>
      <text x="248" y="258" font-size="22" fill="#5d4638">판매자센터에서 대상 상품을 열고 옵션/추가상품 영역으로 이동</text>
    </g>
    <g>
      <circle cx="150" cy="372" r="42" fill="#4c7d38"/>
      <text x="150" y="385" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">2</text>
      <rect x="210" y="318" width="880" height="108" rx="22" fill="#f6fbf3" stroke="#cfe2c3" stroke-width="2"/>
      <text x="248" y="364" font-size="28" font-weight="800" fill="#4c7d38">필수 선택 옵션 사용</text>
      <text x="248" y="400" font-size="22" fill="#5d4638">선택형 옵션을 켜고 등록 방식은 조합형으로 선택</text>
    </g>
    <g>
      <circle cx="150" cy="514" r="42" fill="#a6502a"/>
      <text x="150" y="527" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">3</text>
      <rect x="210" y="460" width="880" height="108" rx="22" fill="#fff3ed" stroke="#efcdbd" stroke-width="2"/>
      <text x="248" y="506" font-size="28" font-weight="800" fill="#a6502a">옵션명 2개 입력</text>
      <text x="248" y="542" font-size="22" fill="#5d4638">옵션명1: 상품 카테고리 / 옵션명2: 세부 선택</text>
    </g>
  </g>
</svg>
