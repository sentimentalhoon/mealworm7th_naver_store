<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">옵션 조합 정리 예시</title>
  <desc id="desc">유효한 옵션 조합은 정상 등록하고 맞지 않는 조합은 사용여부 N 또는 미노출 처리하는 예시 표</desc>
  <rect width="1200" height="760" fill="#fffaf5"/>
  <rect x="40" y="40" width="1120" height="680" rx="34" fill="#fff" stroke="#ead8c5" stroke-width="3"/>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#4f2d16">조합 생성 후 정리 기준</text>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#766052">카테고리와 맞는 세부 선택만 판매 상태로 남깁니다</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="200" width="1000" height="70" rx="16" fill="#4f2d16"/>
    <text x="170" y="245" font-size="24" font-weight="800" fill="#fff">카테고리</text>
    <text x="420" y="245" font-size="24" font-weight="800" fill="#fff">세부 선택</text>
    <text x="740" y="245" font-size="24" font-weight="800" fill="#fff">처리</text>
    <text x="930" y="245" font-size="24" font-weight="800" fill="#fff">이유</text>

    <g fill="#fff" stroke="#ead8c5" stroke-width="2">
      <rect x="100" y="270" width="1000" height="82"/>
      <rect x="100" y="352" width="1000" height="82"/>
      <rect x="100" y="434" width="1000" height="82"/>
      <rect x="100" y="516" width="1000" height="82"/>
      <rect x="100" y="598" width="1000" height="82"/>
    </g>

    <text x="170" y="320" font-size="23" fill="#4f2d16">밀웜</text>
    <text x="420" y="320" font-size="23" fill="#5d4638">생밀웜 1kg / 중</text>
    <text x="740" y="320" font-size="23" fill="#4c7d38">판매</text>
    <text x="930" y="320" font-size="23" fill="#5d4638">정상 조합</text>

    <text x="170" y="402" font-size="23" fill="#4f2d16">밀웜</text>
    <text x="420" y="402" font-size="23" fill="#5d4638">건조밀웜 / 1.0kg</text>
    <text x="740" y="402" font-size="23" fill="#a6502a">사용여부 N</text>
    <text x="930" y="402" font-size="23" fill="#5d4638">카테고리 불일치</text>

    <text x="170" y="484" font-size="23" fill="#4f2d16">슈퍼밀웜</text>
    <text x="420" y="484" font-size="23" fill="#5d4638">마리수형 / 대 / 3000마리</text>
    <text x="740" y="484" font-size="23" fill="#4c7d38">판매</text>
    <text x="930" y="484" font-size="23" fill="#5d4638">정상 조합</text>

    <text x="170" y="566" font-size="23" fill="#4f2d16">건조 밀웜</text>
    <text x="420" y="566" font-size="23" fill="#5d4638">건조밀웜 / 0.5kg</text>
    <text x="740" y="566" font-size="23" fill="#4c7d38">판매</text>
    <text x="930" y="566" font-size="23" fill="#5d4638">정상 조합</text>

    <text x="170" y="648" font-size="23" fill="#4f2d16">건조슈퍼밀웜</text>
    <text x="420" y="648" font-size="23" fill="#5d4638">슈퍼밀웜 1kg / 소</text>
    <text x="740" y="648" font-size="23" fill="#a6502a">사용여부 N</text>
    <text x="930" y="648" font-size="23" fill="#5d4638">카테고리 불일치</text>
  </g>
</svg>
